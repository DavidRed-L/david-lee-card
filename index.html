<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>李宏霖 David Lee｜地政士</title>
  <meta name="description" content="李宏霖 David Lee 地政士的數位名片：Instagram、Facebook、LINE、個人網站與電子郵件。" />
  <meta property="og:title" content="李宏霖 David Lee｜地政士" />
  <meta property="og:description" content="地政士 · 數位名片" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_TW" />
  <meta name="theme-color" content="#f6f1e6" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen overflow-x-hidden bg-[#f6f1e6] bg-[radial-gradient(ellipse_at_top,_#fffdf7_0%,_#f6f1e6_55%,_#ebe2cf_100%)] antialiased">
  <main class="stage grid min-h-[100svh] w-full place-items-center p-3 max-[430px]:p-0" aria-label="李宏霖 數位名片">
    <svg class="card-svg block h-auto" viewBox="0 0 941 1672" role="img" aria-labelledby="pageTitle pageDesc" xmlns="http://www.w3.org/2000/svg">
      <title id="pageTitle">李宏霖 David Lee 數位名片</title>
      <desc id="pageDesc">象牙白與金色的數位名片，頂部顯示 DLL 商標，並連結至 Instagram、Facebook、LINE、個人網站與電子郵件。</desc>

      <defs>
        <radialGradient id="bgGlow" cx="50%" cy="34%" r="62%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="55%" stop-color="#fdf9f0" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#f3ead7" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="goldDot" cx="42%" cy="30%" r="68%">
          <stop offset="0%" stop-color="#f6e2a4"/>
          <stop offset="58%" stop-color="#c9a24e"/>
          <stop offset="100%" stop-color="#8a6a24"/>
        </radialGradient>

        <linearGradient id="goldLine" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="681" y2="0">
          <stop offset="0%" stop-color="#b8923f" stop-opacity="0"/>
          <stop offset="18%" stop-color="#b8923f" stop-opacity="0.70"/>
          <stop offset="50%" stop-color="#d4af5a" stop-opacity="0.95"/>
          <stop offset="82%" stop-color="#b8923f" stop-opacity="0.70"/>
          <stop offset="100%" stop-color="#b8923f" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#d9b866" stop-opacity="0.95"/>
          <stop offset="45%" stop-color="#a98538" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#d9b866" stop-opacity="0.90"/>
        </linearGradient>

        <linearGradient id="cardFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fffefa"/>
          <stop offset="100%" stop-color="#faf5ea"/>
        </linearGradient>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#6b5428" flood-opacity="0.18"/>
        </filter>

        <filter id="foilGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#c9a24e" flood-opacity="0.22"/>
        </filter>

        <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="4" r="0.7" fill="#8a6a24" opacity="0.05"/>
          <circle cx="14" cy="9" r="0.55" fill="#8a6a24" opacity="0.04"/>
          <circle cx="8" cy="15" r="0.45" fill="#ffffff" opacity="0.5"/>
        </pattern>
      </defs>

      <!-- main card -->
      <g filter="url(#softShadow)">
        <rect x="80" y="70" width="781" height="1532" rx="58" fill="url(#cardFill)"/>
      </g>
      <rect x="80" y="70" width="781" height="1532" rx="58" fill="url(#bgGlow)" opacity="0.9"/>
      <rect x="80" y="70" width="781" height="1532" rx="58" fill="url(#grain)" opacity="0.6"/>

      <!-- EXACT 3 border lines only -->
      <rect x="86" y="88" width="769" height="1496" rx="48" fill="none" stroke="url(#frameGold)" stroke-width="2.2" filter="url(#foilGlow)"/>
      <rect x="112" y="126" width="717" height="1410" rx="10" fill="none" stroke="#b8923f" stroke-opacity="0.50" stroke-width="1.5"/>
      <path d="M132 178 H809 V1488 H132 Z" fill="none" stroke="#b8923f" stroke-opacity="0.30" stroke-width="1.2"/>

      <!-- small art-deco breaks / ticks -->
      <g stroke="#a98538" stroke-opacity="0.65" stroke-width="1.35" stroke-linecap="square">
        <path d="M132 178 H210"/>
        <path d="M132 178 V256"/>
        <path d="M731 178 H809"/>
        <path d="M809 178 V256"/>
        <path d="M132 1488 H210"/>
        <path d="M132 1410 V1488"/>
        <path d="M731 1488 H809"/>
        <path d="M809 1410 V1488"/>
      </g>

      <!-- identity -->
      <g class="identity" text-anchor="middle">
        <!-- top logo -->
        <image
          href="dll-logo.png"
          x="220.5"
          y="145"
          width="500"
          height="320"
          preserveAspectRatio="xMidYMid meet"
        />

        <g transform="translate(0 510)">
          <line x1="290" y1="0" x2="651" y2="0" stroke="url(#goldLine)" stroke-width="2"/>
          <circle cx="470.5" cy="0" r="7" fill="url(#goldDot)"/>
        </g>

        <text x="479.5" y="630" class="name">李宏霖</text>
        <text x="473.5" y="692" class="name-en">David Lee</text>
        <text x="478.5" y="754" class="tagline">地政士</text>

        <g transform="translate(0 808)">
          <line x1="274" y1="0" x2="667" y2="0" stroke="url(#goldLine)" stroke-width="2"/>
          <circle cx="470.5" cy="0" r="7" fill="url(#goldDot)"/>
        </g>
      </g>

      <!-- clickable links -->
      <g class="link-list" text-anchor="middle">
        <a href="https://www.instagram.com/david041721/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <text x="477" y="900" class="link-text">INSTAGRAM</text>
          <line x1="342" y1="940" x2="599" y2="940" class="link-line"/>
        </a>

        <a href="https://www.facebook.com/li.hong.lin.129117" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <text x="477" y="1028" class="link-text">FACEBOOK</text>
          <line x1="346" y1="1068" x2="595" y2="1068" class="link-line"/>
        </a>

        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer" aria-label="LINE">
          <text x="477" y="1156" class="link-text">LINE</text>
          <line x1="378" y1="1196" x2="563" y2="1196" class="link-line"/>
        </a>

        <a href="https://www.youtube.com/watch?v=VClI7NywlYA" target="_blank" rel="noopener noreferrer" aria-label="個人網站">
          <text x="478.5" y="1284" class="link-text zh">個人網站</text>
          <line x1="346" y1="1324" x2="595" y2="1324" class="link-line"/>
        </a>

        <a href="mailto:yubawang@gmail.com" aria-label="電子郵件">
          <text x="478.5" y="1412" class="link-text zh">電子郵件</text>
          <line x1="346" y1="1452" x2="595" y2="1452" class="link-line"/>
        </a>
      </g>
    </svg>
  </main>
</body>
</html>
